name: Native iOS Production Release

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Production bundle identifier
        required: true
        type: string
        default: com.photobrain.app
      xcode_scheme:
        description: Shared Production Xcode scheme
        required: true
        type: string
        default: PhotoBrain-Production
      marketing_version:
        description: App Store marketing version shared by native and emergency replacement builds
        required: true
        type: string
        default: 1.0.0
      expected_api_url:
        description: Exact HTTPS API URL embedded in the Production application
        required: true
        type: string
        default: https://photobrain-api.ericj5.com

permissions:
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archive, inspect, and upload Production
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      XCODE_SCHEME: ${{ inputs.xcode_scheme }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      EXPECTED_API_URL: ${{ inputs.expected_api_url }}
      EXPECTED_URL_SCHEME: photobrain
      EXPECTED_MINIMUM_IOS_VERSION: "17.0"
      XCODE_PROJECT: apps/ios/PhotoBrain.xcodeproj
      ARCHIVE_PATH: ${{ runner.temp }}/PhotoBrain.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/PhotoBrain-export
      KEYCHAIN_PATH: ${{ runner.temp }}/photobrain-signing.keychain-db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Validate Production release contract
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_IDENTITY_SHA1: ${{ secrets.IOS_DISTRIBUTION_IDENTITY_SHA1 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
        run: |
          set -euo pipefail
          required=(
            ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY ASC_APP_ID
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
            IOS_DISTRIBUTION_IDENTITY_SHA1
            IOS_TEAM_ID IOS_APPLICATION_ID
            BUNDLE_ID XCODE_SCHEME MARKETING_VERSION EXPECTED_API_URL EXPECTED_URL_SCHEME
            EXPECTED_MINIMUM_IOS_VERSION
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Production release value is absent: $name" >&2
              exit 1
            fi
          done
          [[ "$BUNDLE_ID" == "com.photobrain.app" ]] || {
            echo "The native Production bundle must be com.photobrain.app" >&2
            exit 1
          }
          [[ "$XCODE_SCHEME" == "PhotoBrain-Production" ]] || {
            echo "The native Production Xcode scheme must be PhotoBrain-Production" >&2
            exit 1
          }
          [[ "$EXPECTED_URL_SCHEME" == "photobrain" ]] || {
            echo "The native Production URL scheme must be photobrain" >&2
            exit 1
          }
          [[ "$EXPECTED_MINIMUM_IOS_VERSION" == "17.0" ]] || {
            echo "The native Production minimum iOS version must be 17.0" >&2
            exit 1
          }
          if [[ ${#MARKETING_VERSION} -gt 18 || ! "$MARKETING_VERSION" =~ ^[1-9][0-9]*(\.(0|[1-9][0-9]*)){1,2}$ ]]; then
            echo "MARKETING_VERSION must be a canonical 2- or 3-component numeric App Store version" >&2
            exit 1
          fi
          API_URL="$EXPECTED_API_URL" /usr/bin/python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["API_URL"]
          if raw != raw.strip() or "?" in raw or "#" in raw:
              raise SystemExit("The expected Production API URL must be an HTTPS origin")
          try:
              url = urlsplit(raw)
              url.port
          except ValueError:
              raise SystemExit("The expected Production API URL is malformed")
          host = (url.hostname or "").lower()
          if (
              url.scheme != "https"
              or url.username is not None
              or url.password is not None
              or url.query
              or url.fragment
              or url.path not in ("", "/")
              or not host
          ):
              raise SystemExit("The expected Production API URL must be an HTTPS origin")
          is_local = (
              host in {"localhost", "0.0.0.0", "::1"}
              or host.startswith(("127.", "10.", "192.168.", "169.254."))
              or host.endswith(".local")
              or "." not in host
          )
          parts = host.split(".")
          if len(parts) == 4:
              try:
                  octets = [int(part) for part in parts]
              except ValueError:
                  octets = []
              is_local = is_local or (
                  len(octets) == 4
                  and octets[0] == 172
                  and 16 <= octets[1] <= 31
              )
          if is_local:
              raise SystemExit("The expected Production API URL must use a non-local host")
          PY
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "IOS_TEAM_ID is malformed" >&2
            exit 1
          }
          [[ "$IOS_APPLICATION_ID" == "$IOS_TEAM_ID.$BUNDLE_ID" ]] || {
            echo "IOS_APPLICATION_ID must exactly match IOS_TEAM_ID and the Production bundle" >&2
            exit 1
          }
          identity=${IOS_DISTRIBUTION_IDENTITY_SHA1//:/}
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "IOS_DISTRIBUTION_IDENTITY_SHA1 is malformed" >&2
            exit 1
          }
          [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]] || {
            echo "ASC_APP_ID must be numeric" >&2
            exit 1
          }
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "ASC_KEY_ID must be a 10-character alphanumeric key ID" >&2
            exit 1
          }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || {
            echo "ASC_ISSUER_ID must be a UUID" >&2
            exit 1
          }
          xcodebuild -version

      - name: Derive durable cross-workflow build reservation
        id: reserve
        env:
          REPOSITORY_RUN_ID: ${{ github.run_id }}
          REPOSITORY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "github.run_id is not a canonical positive integer" >&2
            exit 1
          }
          [[ "$REPOSITORY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "github.run_attempt is not a canonical positive integer" >&2
            exit 1
          }
          (( REPOSITORY_RUN_ATTEMPT <= 99 )) || {
            echo "github.run_attempt exceeds the two-digit reservation range" >&2
            exit 1
          }
          (( REPOSITORY_RUN_ID <= 90071992547408 )) || {
            echo "github.run_id cannot produce a JavaScript-safe build reservation" >&2
            exit 1
          }
          floor=$((REPOSITORY_RUN_ID * 100 + REPOSITORY_RUN_ATTEMPT))
          echo "build_number_floor=$floor" >> "$GITHUB_OUTPUT"

      - name: Allocate serialized App Store build number
        id: allocate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          BUILD_NUMBER_FLOOR: ${{ steps.reserve.outputs.build_number_floor }}
        run: node apps/ios/scripts/allocate-app-store-build.mjs

      - name: Import and validate manual signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXPECTED_IDENTITY_SHA1: ${{ secrets.IOS_DISTRIBUTION_IDENTITY_SHA1 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/production.mobileprovision"
          profile_plist="$RUNNER_TEMP/production-profile.plist"
          keychain_password=$(/usr/bin/openssl rand -hex 32)
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$profile"
          [[ -s "$certificate" && -s "$profile" ]] || {
            echo "A signing asset decoded to an empty file" >&2
            exit 1
          }

          /usr/bin/security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          /usr/bin/security import "$certificate" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH" >/dev/null
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN_PATH"

          identity=$(printf '%s' "$EXPECTED_IDENTITY_SHA1" | /usr/bin/tr -d ':' | /usr/bin/tr '[:lower:]' '[:upper:]')
          identity_count=$(
            /usr/bin/security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              /usr/bin/grep -c "$identity" || true
          )
          [[ "$identity_count" -eq 1 ]] || {
            echo "The expected valid distribution signing identity was not imported exactly once" >&2
            exit 1
          }

          /usr/bin/security cms -D -i "$profile" > "$profile_plist"
          /usr/bin/plutil -lint "$profile_plist" >/dev/null
          PROFILE_PLIST="$profile_plist" \
          EXPECTED_TEAM_ID="$TEAM_ID" \
          EXPECTED_APPLICATION_ID="$APPLICATION_ID" \
          EXPECTED_IDENTITY_SHA1="$identity" \
          /usr/bin/python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as handle:
              profile = plistlib.load(handle)
          entitlements = profile.get("Entitlements")
          if not isinstance(entitlements, dict):
              raise SystemExit("Provisioning profile entitlements are missing")
          expected_team = os.environ["EXPECTED_TEAM_ID"]
          expected_application = os.environ["EXPECTED_APPLICATION_ID"]
          if profile.get("TeamIdentifier") != [expected_team]:
              raise SystemExit("Provisioning profile team does not match IOS_TEAM_ID")
          if entitlements.get("com.apple.developer.team-identifier") != expected_team:
              raise SystemExit("Provisioning profile entitlement team does not match IOS_TEAM_ID")
          if entitlements.get("application-identifier") != expected_application:
              raise SystemExit("Provisioning profile application identifier does not match")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("Provisioning profile is not a distribution profile")
          if "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices") is True:
              raise SystemExit("Provisioning profile is not an App Store profile")
          if "iOS" not in profile.get("Platform", []):
              raise SystemExit("Provisioning profile does not support iOS")
          expiration = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc)
          if not isinstance(expiration, datetime.datetime):
              raise SystemExit("Provisioning profile expiration is missing")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration <= now:
              raise SystemExit("Provisioning profile is expired")
          certificate_hashes = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile.get("DeveloperCertificates", [])
              if isinstance(certificate, bytes)
          }
          if os.environ["EXPECTED_IDENTITY_SHA1"] not in certificate_hashes:
              raise SystemExit("Distribution certificate is not authorized by the provisioning profile")
          PY

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]] || {
            echo "Provisioning profile UUID is malformed" >&2
            exit 1
          }
          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          /bin/mkdir -p "$profile_directory"
          /bin/cp "$profile" "$profile_directory/$profile_uuid.mobileprovision"

          {
            echo "SIGNING_IDENTITY_SHA1=$identity"
            echo "PROVISIONING_PROFILE_UUID=$profile_uuid"
          } >> "$GITHUB_ENV"

      - name: Archive signed Production application
        env:
          BUILD_NUMBER: ${{ steps.allocate.outputs.build_number }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Allocated build number is malformed" >&2
            exit 1
          }
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Production \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PHOTO_BRAIN_API_URL="$EXPECTED_API_URL" \
            IPHONEOS_DEPLOYMENT_TARGET="$EXPECTED_MINIMUM_IOS_VERSION" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY_SHA1" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          [[ -d "$ARCHIVE_PATH/Products/Applications/PhotoBrain.app" ]] || {
            echo "The signed application is absent from the archive" >&2
            exit 1
          }

      - name: Export signed Production IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_OPTIONS="$export_options" \
          TEAM_ID="$TEAM_ID" \
          BUNDLE_ID="$BUNDLE_ID" \
          PROFILE_UUID="$PROVISIONING_PROFILE_UUID" \
          SIGNING_IDENTITY="$SIGNING_IDENTITY_SHA1" \
          /usr/bin/python3 - <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"],
              },
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["TEAM_ID"],
              "uploadSymbols": True,
          }
          with open(os.environ["EXPORT_OPTIONS"], "wb") as handle:
              plistlib.dump(options, handle, sort_keys=True)
          PY
          /usr/bin/plutil -lint "$export_options" >/dev/null
          /bin/mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$export_options"

          shopt -s nullglob
          ipas=("$EXPORT_PATH"/*.ipa)
          shopt -u nullglob
          [[ ${#ipas[@]} -eq 1 ]] || {
            echo "The export must contain exactly one IPA" >&2
            exit 1
          }
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"

      - name: Strictly inspect signed Production artifact
        env:
          APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.allocate.outputs.build_number }}
        run: |
          set -euo pipefail
          apps/ios/scripts/inspect-signed-artifact.sh \
            "$IPA_PATH" \
            "$BUNDLE_ID" \
            "$APPLICATION_ID" \
            "$TEAM_ID" \
            "$EXPECTED_URL_SCHEME" \
            "$EXPECTED_API_URL" \
            "$MARKETING_VERSION" \
            "$BUILD_NUMBER" \
            "$EXPECTED_MINIMUM_IOS_VERSION"

      - name: Package archive and dSYMs for retention
        env:
          BUILD_NUMBER: ${{ steps.allocate.outputs.build_number }}
        run: |
          set -euo pipefail
          dsym="$ARCHIVE_PATH/dSYMs/PhotoBrain.app.dSYM"
          dwarf="$dsym/Contents/Resources/DWARF/PhotoBrain"
          [[ -d "$dsym" && -f "$dwarf" ]] || {
            echo "The signed archive is missing the expected PhotoBrain application dSYM" >&2
            exit 1
          }
          retained="$RUNNER_TEMP/retained"
          /bin/mkdir -p "$retained"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$ARCHIVE_PATH" \
            "$retained/PhotoBrain-$MARKETING_VERSION-$BUILD_NUMBER.xcarchive.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$ARCHIVE_PATH/dSYMs" \
            "$retained/PhotoBrain-$MARKETING_VERSION-$BUILD_NUMBER-dSYMs.zip"
          /bin/cp "$IPA_PATH" "$retained/PhotoBrain-$MARKETING_VERSION-$BUILD_NUMBER.ipa"

      - name: Retain inspected archive, dSYMs, and IPA
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-production-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}
          path: ${{ runner.temp }}/retained
          if-no-files-found: error
          retention-days: 30

      - name: Install App Store Connect upload key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_$ASC_KEY_ID.p8"
          /bin/mkdir -p "$key_directory"
          KEY_PATH="$key_path" node - <<'NODE'
          const { writeFileSync } = require("node:fs");
          const value = process.env.ASC_PRIVATE_KEY;
          if (!value || !process.env.KEY_PATH) process.exit(1);
          const key = value.includes("\\n") && !value.includes("\n")
            ? value.replaceAll("\\n", "\n")
            : value;
          writeFileSync(process.env.KEY_PATH, `${key.trim()}\n`, { mode: 0o600 });
          NODE
          /bin/chmod 600 "$key_path"

      - name: Upload inspected IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set +e
          /usr/bin/security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          if [[ -n "${PROVISIONING_PROFILE_UUID:-}" ]]; then
            /bin/rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROVISIONING_PROFILE_UUID.mobileprovision"
          fi
          /bin/rm -f \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/production.mobileprovision" \
            "$RUNNER_TEMP/production-profile.plist"
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            /bin/rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          fi
