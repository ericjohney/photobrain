name: Native iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Report pinned Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test Preview on iOS Simulator
        run: |
          xcodebuild \
            -project apps/ios/PhotoBrain.xcodeproj \
            -scheme PhotoBrain-Preview \
            -configuration Preview \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Set up Bun for the UI-test fixture API
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --linker hoisted

      # Apple's system SQLite cannot load extensions; db/setup.ts uses Homebrew's for sqlite-vec.
      - name: Install extension-capable SQLite
        run: brew list sqlite >/dev/null 2>&1 || brew install sqlite

      - name: Run UI flows against the fixture API
        run: apps/ios/scripts/run-ui-tests.sh
