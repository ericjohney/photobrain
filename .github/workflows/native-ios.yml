name: Native iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-ci
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Report pinned Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test Preview on iOS Simulator
        run: |
          xcodebuild \
            -project apps/ios/PhotoBrain.xcodeproj \
            -scheme PhotoBrain-Preview \
            -configuration Preview \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO \
            test
