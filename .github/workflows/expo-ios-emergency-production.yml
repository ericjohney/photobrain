name: Expo iOS Emergency Production Replacement

on:
  workflow_dispatch:
    inputs:
      expected_api_url:
        description: Exact HTTPS API URL to embed and verify
        required: true
        type: string
        default: https://photobrain-api.ericj5.com
      marketing_version:
        description: App Store marketing version to replace (for example 1.0.0)
        required: true
        type: string
        default: 1.0.0
      confirm_production_replacement:
        description: Build and upload a higher-build Expo replacement to TestFlight (never an OTA update)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

env:
  EXPECTED_BUNDLE_ID: com.photobrain.app
  EXPECTED_URL_SCHEME: photobrain
  EXPECTED_UPDATES_URL: https://u.expo.dev/5fcc4958-f697-46c6-9cfc-cd2ce0ac695c
  EXPECTED_UPDATES_CHANNEL: production
  EXPECTED_IOS_DEPLOYMENT_TARGET: "17.0"
  OUTPUT_ROOT: ${{ github.workspace }}/artifacts/expo-ios-production

jobs:
  build-inspect-and-upload:
    if: ${{ inputs.confirm_production_replacement }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Report pinned Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Install pinned EAS CLI
        run: npm install --global eas-cli@24.7.0

      - name: Validate release authority inputs
        env:
          EXPECTED_API_URL: ${{ inputs.expected_api_url }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_IDENTITY_SHA1: ${{ secrets.IOS_DISTRIBUTION_IDENTITY_SHA1 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          for name in \
            EXPECTED_API_URL \
            MARKETING_VERSION \
            IOS_APPLICATION_ID \
            IOS_TEAM_ID \
            IOS_DISTRIBUTION_IDENTITY_SHA1 \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY \
            ASC_APP_ID \
            EXPO_TOKEN; do
            [[ -n "${!name:-}" ]] || { printf 'Missing required release value: %s\n' "$name" >&2; exit 1; }
          done
          EXPECTED_API_URL="$EXPECTED_API_URL" /usr/bin/python3 <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["EXPECTED_API_URL"]
          if any(value.isspace() for value in raw) or "?" in raw or "#" in raw:
              raise SystemExit("expected_api_url must be a Production HTTPS origin")
          try:
              parsed = urlsplit(raw)
              host = parsed.hostname
              parsed.port
          except ValueError as error:
              raise SystemExit("expected_api_url is malformed") from error
          if (
              parsed.scheme != "https"
              or not host
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in ("", "/")
          ):
              raise SystemExit("expected_api_url must be an HTTPS origin without credentials, path, query, or fragment")
          host = host.lower()
          local = (
              host in {"localhost", "0.0.0.0", "::1"}
              or host.startswith(("127.", "10.", "192.168.", "169.254."))
              or host.endswith(".local")
              or "." not in host
          )
          parts = host.split(".")
          if len(parts) == 4:
              try:
                  octets = [int(value) for value in parts]
              except ValueError:
                  octets = []
              if len(octets) == 4 and octets[0] == 172 and 16 <= octets[1] <= 31:
                  local = True
          if local:
              raise SystemExit("expected_api_url must not use a local, private, or single-label host")
          PY
          [[ ${#MARKETING_VERSION} -le 18 && "$MARKETING_VERSION" =~ ^[1-9][0-9]*(\.(0|[1-9][0-9]*)){1,2}$ ]] || { printf 'marketing_version must be a canonical 2- or 3-component dotted numeric version\n' >&2; exit 1; }
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { printf 'IOS_TEAM_ID must be a 10-character alphanumeric team ID\n' >&2; exit 1; }
          [[ "$IOS_APPLICATION_ID" == "$IOS_TEAM_ID.$EXPECTED_BUNDLE_ID" ]] || { printf 'IOS_APPLICATION_ID must equal IOS_TEAM_ID.%s\n' "$EXPECTED_BUNDLE_ID" >&2; exit 1; }
          identity=${IOS_DISTRIBUTION_IDENTITY_SHA1//:/}
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || { printf 'IOS_DISTRIBUTION_IDENTITY_SHA1 must be a certificate SHA-1\n' >&2; exit 1; }
          [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]] || { printf 'ASC_APP_ID must be numeric\n' >&2; exit 1; }
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { printf 'ASC_KEY_ID must be a 10-character alphanumeric key ID\n' >&2; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || { printf 'ASC_ISSUER_ID must be a UUID\n' >&2; exit 1; }

      - name: Derive durable cross-workflow build reservation
        id: reserve
        env:
          REPOSITORY_RUN_ID: ${{ github.run_id }}
          REPOSITORY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "github.run_id is not a canonical positive integer" >&2
            exit 1
          }
          [[ "$REPOSITORY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "github.run_attempt is not a canonical positive integer" >&2
            exit 1
          }
          (( REPOSITORY_RUN_ATTEMPT <= 99 )) || {
            echo "github.run_attempt exceeds the two-digit reservation range" >&2
            exit 1
          }
          (( REPOSITORY_RUN_ID <= 90071992547408 )) || {
            echo "github.run_id cannot produce a JavaScript-safe build reservation" >&2
            exit 1
          }
          floor=$((REPOSITORY_RUN_ID * 100 + REPOSITORY_RUN_ATTEMPT))
          echo "build_number_floor=$floor" >> "$GITHUB_OUTPUT"

      - name: Allocate next App Store build number
        id: allocate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          BUILD_NUMBER_FLOOR: ${{ steps.reserve.outputs.build_number_floor }}
        run: node apps/ios/scripts/allocate-app-store-build.mjs

      - name: Install manual App Store signing identity
        env:
          IOS_APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_IDENTITY_SHA1: ${{ secrets.IOS_DISTRIBUTION_IDENTITY_SHA1 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/photobrain-distribution.p12"
          profile_path="$RUNNER_TEMP/photobrain-app-store.mobileprovision"
          decoded_profile="$RUNNER_TEMP/photobrain-app-store.plist"
          keychain_path="$RUNNER_TEMP/photobrain-signing.keychain-db"
          keychain_password=$(/usr/bin/openssl rand -hex 32)

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$profile_path"
          [[ -s "$certificate_path" && -s "$profile_path" ]] || { printf 'A signing asset decoded to an empty file\n' >&2; exit 1; }
          /usr/bin/security cms -D -i "$profile_path" > "$decoded_profile"
          /usr/bin/plutil -lint "$decoded_profile" >/dev/null

          identity=$(printf '%s' "$IOS_DISTRIBUTION_IDENTITY_SHA1" | /usr/bin/tr -d ':' | /usr/bin/tr '[:lower:]' '[:upper:]')
          PROFILE_PLIST="$decoded_profile" \
          EXPECTED_TEAM_ID="$IOS_TEAM_ID" \
          EXPECTED_APPLICATION_ID="$IOS_APPLICATION_ID" \
          EXPECTED_IDENTITY_SHA1="$identity" \
          /usr/bin/python3 - <<'PY'
          import datetime
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as handle:
              profile = plistlib.load(handle)
          entitlements = profile.get("Entitlements")
          if not isinstance(entitlements, dict):
              raise SystemExit("Provisioning profile entitlements are missing")
          expected_team = os.environ["EXPECTED_TEAM_ID"]
          if profile.get("TeamIdentifier") != [expected_team]:
              raise SystemExit("Provisioning profile team does not match IOS_TEAM_ID")
          if entitlements.get("com.apple.developer.team-identifier") != expected_team:
              raise SystemExit("Provisioning profile entitlement team does not match IOS_TEAM_ID")
          if entitlements.get("application-identifier") != os.environ["EXPECTED_APPLICATION_ID"]:
              raise SystemExit("Provisioning profile application identifier does not match")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("Provisioning profile is not a distribution profile")
          if entitlements.get("beta-reports-active") is not True:
              raise SystemExit("Provisioning profile is not enabled for TestFlight")
          if "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices") is True:
              raise SystemExit("Provisioning profile is not an App Store profile")
          if "iOS" not in profile.get("Platform", []):
              raise SystemExit("Provisioning profile does not support iOS")
          expiration = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc)
          if not isinstance(expiration, datetime.datetime):
              raise SystemExit("Provisioning profile expiration is missing")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration <= now:
              raise SystemExit("Provisioning profile is expired")
          certificate_hashes = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile.get("DeveloperCertificates", [])
              if isinstance(certificate, bytes)
          }
          if os.environ["EXPECTED_IDENTITY_SHA1"] not in certificate_hashes:
              raise SystemExit("Distribution certificate is not authorized by the provisioning profile")
          PY

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_profile")
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]] || { printf 'Provisioning profile UUID is malformed\n' >&2; exit 1; }

          /usr/bin/security create-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain_path"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          /usr/bin/security list-keychains -d user -s "$keychain_path"
          /usr/bin/security default-keychain -d user -s "$keychain_path"
          identity_count=$(/usr/bin/security find-identity -v -p codesigning "$keychain_path" | /usr/bin/grep -ci "$identity" || true)
          [[ "$identity_count" -eq 1 ]] || { printf 'Configured signing certificate SHA-1 was not imported exactly once\n' >&2; exit 1; }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf 'IOS_SIGNING_IDENTITY_SHA1=%s\n' "$identity" >> "$GITHUB_ENV"
          printf 'IOS_PROFILE_UUID=%s\n' "$profile_uuid" >> "$GITHUB_ENV"

      - name: Resolve EAS Production environment and build signed archive
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED_API_URL: ${{ inputs.expected_api_url }}
          BUILD_NUMBER: ${{ steps.allocate.outputs.build_number }}
          REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/build-expo-ios-production.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          MARKETING_VERSION=$REQUESTED_MARKETING_VERSION
          export MARKETING_VERSION

          : "${EXPO_PUBLIC_API_URL:?EAS Production must define EXPO_PUBLIC_API_URL}"
          [[ "$EXPO_PUBLIC_API_URL" == "$EXPECTED_API_URL" ]] || { printf 'EAS Production EXPO_PUBLIC_API_URL does not match expected_api_url\n' >&2; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { printf 'Allocator returned an invalid build number\n' >&2; exit 1; }
          [[ ${#MARKETING_VERSION} -le 18 && "$MARKETING_VERSION" =~ ^[1-9][0-9]*(\.(0|[1-9][0-9]*)){1,2}$ ]] || { printf 'Marketing version is invalid\n' >&2; exit 1; }
          [[ "$EXPECTED_IOS_DEPLOYMENT_TARGET" == "17.0" ]] || { printf 'Emergency iOS deployment target must be 17.0\n' >&2; exit 1; }
          [[ "$IOS_APPLICATION_ID" == "$IOS_TEAM_ID.$EXPECTED_BUNDLE_ID" ]] || { printf 'Signing application identifier does not match the production bundle\n' >&2; exit 1; }

          export CI=1
          export NODE_ENV=production
          export EAS_BUILD=true
          export EAS_BUILD_PROFILE=production
          export EAS_UPDATE_CHANNEL="$EXPECTED_UPDATES_CHANNEL"

          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const document = JSON.parse(readFileSync("app.json", "utf8"));
          const app = document.expo;
          const profile = JSON.parse(readFileSync("eas.json", "utf8")).build.production;
          const expected = {
            bundle: process.env.EXPECTED_BUNDLE_ID,
            scheme: process.env.EXPECTED_URL_SCHEME,
            api: process.env.EXPECTED_API_URL,
            updates: process.env.EXPECTED_UPDATES_URL,
            channel: process.env.EXPECTED_UPDATES_CHANNEL,
            deploymentTarget: process.env.EXPECTED_IOS_DEPLOYMENT_TARGET,
            marketingVersion: process.env.MARKETING_VERSION,
          };
          if (app.ios?.bundleIdentifier !== expected.bundle) throw new Error("app.json production bundle identifier mismatch");
          if (app.scheme !== expected.scheme) throw new Error("app.json production URL scheme mismatch");
          if (app.updates?.url !== expected.updates) throw new Error("app.json Expo Updates URL mismatch");
          if (app.runtimeVersion?.policy !== "fingerprint") throw new Error("app.json must use fingerprint runtime policy");
          if (profile.environment !== "production" || profile.channel !== expected.channel) throw new Error("EAS production profile environment/channel mismatch");
          if (profile.env?.EXPO_PUBLIC_API_URL !== expected.api) throw new Error("EAS production profile API URL mismatch");
          if (process.env.EXPO_PUBLIC_API_URL !== expected.api) throw new Error("resolved EAS Production API URL mismatch");
          const buildProperties = app.plugins.filter(
            (plugin) => Array.isArray(plugin) && plugin[0] === "expo-build-properties",
          );
          if (buildProperties.length !== 1 || typeof buildProperties[0][1] !== "object" || buildProperties[0][1] === null) {
            throw new Error("Expected exactly one configured expo-build-properties plugin");
          }
          const options = buildProperties[0][1];
          options.ios = { ...(options.ios ?? {}), deploymentTarget: expected.deploymentTarget };
          app.version = expected.marketingVersion;
          writeFileSync("app.json", `${JSON.stringify(document, null, "\t")}\n`);
          NODE

          runtime_json=$(node ../../node_modules/expo-updates/bin/cli.js runtimeversion:resolve --platform ios --workflow managed)
          runtime_version=$(node -e 'const result = JSON.parse(process.argv[1]); const value = result.runtimeVersion; if (result.workflow !== "managed" || !Array.isArray(result.fingerprintSources) || result.fingerprintSources.length === 0 || !/^[0-9a-f]{40,64}$/i.test(value ?? "")) process.exit(1); process.stdout.write(value);' "$runtime_json")
          [[ -n "$runtime_version" ]] || { printf 'Expo managed fingerprint runtime resolution failed\n' >&2; exit 1; }

          rm -rf ios "$OUTPUT_ROOT"
          mkdir -p "$OUTPUT_ROOT/export"
          node ../../node_modules/expo/bin/cli prebuild --clean --platform ios --no-install
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const expected = process.env.EXPECTED_IOS_DEPLOYMENT_TARGET;
          const properties = JSON.parse(readFileSync("ios/Podfile.properties.json", "utf8"));
          if (properties["ios.deploymentTarget"] !== expected) {
            throw new Error("Generated Podfile deployment target mismatch");
          }
          NODE

          INFO_PLIST=ios/PhotoBrain/Info.plist \
          EXPO_PLIST=ios/PhotoBrain/Supporting/Expo.plist \
          RUNTIME_VERSION="$runtime_version" \
          /usr/bin/python3 <<'PY'
          import os
          import plistlib

          info_path = os.environ["INFO_PLIST"]
          expo_path = os.environ["EXPO_PLIST"]
          with open(info_path, "rb") as handle:
              info = plistlib.load(handle)
          with open(expo_path, "rb") as handle:
              expo = plistlib.load(handle)

          production_url_types = []
          for item in info.get("CFBundleURLTypes", []):
              if not isinstance(item, dict):
                  continue
              schemes = [
                  value
                  for value in item.get("CFBundleURLSchemes", [])
                  if isinstance(value, str) and not value.startswith("exp+")
              ]
              if schemes:
                  item["CFBundleURLSchemes"] = schemes
                  production_url_types.append(item)
          info["CFBundleURLTypes"] = production_url_types
          info["PhotoBrainAPIURL"] = os.environ["EXPECTED_API_URL"]
          info["PhotoBrainEnvironment"] = "Production"
          info["CFBundleVersion"] = os.environ["BUILD_NUMBER"]
          info["CFBundleShortVersionString"] = os.environ["MARKETING_VERSION"]
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": False,
              "NSAllowsLocalNetworking": False,
          }
          info.pop("NSBonjourServices", None)
          info.pop("NSLocalNetworkUsageDescription", None)

          expo["EXUpdatesEnabled"] = True
          expo["EXUpdatesCheckOnLaunch"] = "ALWAYS"
          expo["EXUpdatesLaunchWaitMs"] = 0
          expo["EXUpdatesURL"] = os.environ["EXPECTED_UPDATES_URL"]
          expo["EXUpdatesRuntimeVersion"] = os.environ["RUNTIME_VERSION"]
          expo["EXUpdatesRequestHeaders"] = {
              "expo-channel-name": os.environ["EXPECTED_UPDATES_CHANNEL"],
          }

          with open(info_path, "wb") as handle:
              plistlib.dump(info, handle, sort_keys=False)
          with open(expo_path, "wb") as handle:
              plistlib.dump(expo, handle, sort_keys=False)
          PY

          (
            cd ios
            pod install
          )
          effective_settings="$RUNNER_TEMP/PhotoBrain-Release-build-settings.txt"
          xcodebuild \
            -project ios/PhotoBrain.xcodeproj \
            -target PhotoBrain \
            -configuration Release \
            -showBuildSettings > "$effective_settings"
          BUILD_SETTINGS_PATH="$effective_settings" /usr/bin/python3 <<'PY'
          import os

          expected = os.environ["EXPECTED_IOS_DEPLOYMENT_TARGET"]
          with open(os.environ["BUILD_SETTINGS_PATH"], encoding="utf-8") as handle:
              values = [
                  line.split("=", 1)[1].strip()
                  for line in handle
                  if line.strip().startswith("IPHONEOS_DEPLOYMENT_TARGET =")
              ]
          if values != [expected]:
              raise SystemExit(
                  f"Effective PhotoBrain Release deployment target mismatch: {values!r}"
              )
          PY
          cp ios/Podfile.lock "$OUTPUT_ROOT/Podfile.lock"

          export_options="$RUNNER_TEMP/ExpoProductionExportOptions.plist"
          EXPORT_OPTIONS_PATH="$export_options" /usr/bin/python3 <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "method": "app-store-connect",
              "provisioningProfiles": {
                  os.environ["EXPECTED_BUNDLE_ID"]: os.environ["IOS_PROFILE_UUID"],
              },
              "signingCertificate": os.environ["IOS_SIGNING_IDENTITY_SHA1"],
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["IOS_TEAM_ID"],
              "uploadSymbols": True,
          }
          with open(os.environ["EXPORT_OPTIONS_PATH"], "wb") as handle:
              plistlib.dump(options, handle, sort_keys=False)
          PY

          NODE_BINARY=$(command -v node) xcodebuild \
            -workspace ios/PhotoBrain.xcworkspace \
            -scheme PhotoBrain \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$OUTPUT_ROOT/PhotoBrain.xcarchive" \
            clean archive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            IPHONEOS_DEPLOYMENT_TARGET="$EXPECTED_IOS_DEPLOYMENT_TARGET" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY_SHA1" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/photobrain-signing.keychain-db"
          app_dsym="$OUTPUT_ROOT/PhotoBrain.xcarchive/dSYMs/PhotoBrain.app.dSYM"
          app_dwarf="$app_dsym/Contents/Resources/DWARF/PhotoBrain"
          [[ -d "$app_dsym" && -f "$app_dwarf" ]] || { printf 'Signed archive contains no PhotoBrain application dSYM\n' >&2; exit 1; }

          xcodebuild \
            -exportArchive \
            -archivePath "$OUTPUT_ROOT/PhotoBrain.xcarchive" \
            -exportPath "$OUTPUT_ROOT/export" \
            -exportOptionsPlist "$export_options"

          printf 'runtime_version=%s\n' "$runtime_version" >> "$GITHUB_OUTPUT"
          SCRIPT
          chmod 700 "$RUNNER_TEMP/build-expo-ios-production.sh"
          eas env:exec production "$RUNNER_TEMP/build-expo-ios-production.sh" --non-interactive

      - name: Strictly inspect signed Expo IPA
        id: inspect
        env:
          EXPECTED_API_URL: ${{ inputs.expected_api_url }}
          EXPECTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
          EXPECTED_BUILD_NUMBER: ${{ steps.allocate.outputs.build_number }}
          EXPECTED_APPLICATION_ID: ${{ secrets.IOS_APPLICATION_ID }}
          EXPECTED_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPECTED_RUNTIME_VERSION: ${{ steps.build.outputs.runtime_version }}
          EXPECTED_MINIMUM_IOS_VERSION: ${{ env.EXPECTED_IOS_DEPLOYMENT_TARGET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$OUTPUT_ROOT/export/"*.ipa)
          shopt -u nullglob
          [[ ${#ipas[@]} -eq 1 ]] || { printf 'Expected exactly one exported IPA\n' >&2; exit 1; }
          ipa=${ipas[0]}
          bash apps/mobile/scripts/inspect-expo-signed-artifact.sh \
            "$ipa" \
            "$EXPECTED_BUNDLE_ID" \
            "$EXPECTED_APPLICATION_ID" \
            "$EXPECTED_TEAM_ID" \
            "$EXPECTED_URL_SCHEME" \
            "$EXPECTED_API_URL" \
            "$EXPECTED_MARKETING_VERSION" \
            "$EXPECTED_BUILD_NUMBER" \
            "$EXPECTED_MINIMUM_IOS_VERSION" \
            "$EXPECTED_UPDATES_URL" \
            "$EXPECTED_RUNTIME_VERSION" \
            "$EXPECTED_UPDATES_CHANNEL" | tee "$OUTPUT_ROOT/signed-artifact-inspection.txt"
          printf 'ipa=%s\n' "$ipa" >> "$GITHUB_OUTPUT"

      - name: Record archive and dSYM evidence
        run: |
          set -euo pipefail
          app_dsym="$OUTPUT_ROOT/PhotoBrain.xcarchive/dSYMs/PhotoBrain.app.dSYM"
          app_dwarf="$app_dsym/Contents/Resources/DWARF/PhotoBrain"
          [[ -d "$app_dsym" && -f "$app_dwarf" ]] || { printf 'Archive contains no PhotoBrain application dSYM\n' >&2; exit 1; }
          xcrun dwarfdump --uuid "$app_dsym" | tee "$OUTPUT_ROOT/dsym-uuids.txt"
          printf 'marketing_version=%s\nbuild_number=%s\nminimum_ios_version=%s\nruntime_version=%s\n' \
            "${{ inputs.marketing_version }}" \
            "${{ steps.allocate.outputs.build_number }}" \
            "$EXPECTED_IOS_DEPLOYMENT_TARGET" \
            "${{ steps.build.outputs.runtime_version }}" > "$OUTPUT_ROOT/release-metadata.txt"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$OUTPUT_ROOT/PhotoBrain.xcarchive" \
            "$OUTPUT_ROOT/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}.xcarchive.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$OUTPUT_ROOT/PhotoBrain.xcarchive/dSYMs" \
            "$OUTPUT_ROOT/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}-dSYMs.zip"
          [[ -s "$OUTPUT_ROOT/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}.xcarchive.zip" ]] || { printf 'Mode-preserving xcarchive package is missing\n' >&2; exit 1; }
          [[ -s "$OUTPUT_ROOT/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}-dSYMs.zip" ]] || { printf 'Mode-preserving dSYM package is missing\n' >&2; exit 1; }
          /usr/bin/shasum -a 256 "${{ steps.inspect.outputs.ipa }}" > "$OUTPUT_ROOT/ipa.sha256"

      - name: Retain signed archive, IPA, dSYMs, and inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: expo-ios-production-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}
          path: |
            ${{ env.OUTPUT_ROOT }}/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}.xcarchive.zip
            ${{ env.OUTPUT_ROOT }}/PhotoBrain-${{ inputs.marketing_version }}-${{ steps.allocate.outputs.build_number }}-dSYMs.zip
            ${{ env.OUTPUT_ROOT }}/export/*.ipa
            ${{ env.OUTPUT_ROOT }}/signed-artifact-inspection.txt
            ${{ env.OUTPUT_ROOT }}/dsym-uuids.txt
            ${{ env.OUTPUT_ROOT }}/ipa.sha256
            ${{ env.OUTPUT_ROOT }}/release-metadata.txt
            ${{ env.OUTPUT_ROOT }}/Podfile.lock
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Configure App Store Connect upload key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          KEY_PATH="$key_path" node - <<'NODE'
          const { writeFileSync } = require("node:fs");
          const value = process.env.ASC_PRIVATE_KEY;
          if (!value || !process.env.KEY_PATH) process.exit(1);
          const key = value.includes("\\n") && !value.includes("\n")
            ? value.replaceAll("\\n", "\n")
            : value;
          writeFileSync(process.env.KEY_PATH, `${key.trim()}\n`, { mode: 0o600 });
          NODE
          chmod 600 "$key_path"
          /usr/bin/openssl pkey -in "$key_path" -check -noout >/dev/null || { printf 'ASC_PRIVATE_KEY is not a valid private key\n' >&2; exit 1; }

      - name: Upload inspected replacement to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA: ${{ steps.inspect.outputs.ipa }}
        run: xcrun altool --upload-app --file "$IPA" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary release credentials
        if: always()
        run: |
          /usr/bin/security delete-keychain "$RUNNER_TEMP/photobrain-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/photobrain-distribution.p12" \
            "$RUNNER_TEMP/photobrain-app-store.mobileprovision" \
            "$RUNNER_TEMP/photobrain-app-store.plist" \
            "$RUNNER_TEMP/ExpoProductionExportOptions.plist" \
            "$RUNNER_TEMP/build-expo-ios-production.sh" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID:-missing}.mobileprovision" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
