name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Install Playwright deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd apps/web && bunx playwright install-deps chromium

      - name: Run web E2E tests
        run: cd apps/web && bun run test:e2e

  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Run API tests
        # Shared runners overshoot locally calibrated wall-clock budgets by up
        # to ~1.8x; query-plan assertions remain the regression guard.
        env:
          PHOTOBRAIN_PERF_BUDGET_SCALE: "3"
        run: cd apps/api && bun test

      - name: Typecheck API
        run: cd apps/api && bun run typecheck

  docker-check:
    if: github.event_name == 'pull_request'
    needs: [test-web, test-api]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {target: api-cuda, cuda: "1"}
          - {target: web, cuda: "0"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: DENOISE_CUDA=${{ matrix.cuda }}
          push: false
          cache-from: type=gha
