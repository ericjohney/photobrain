name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test-web:
    runs-on: ericjohney-org-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run web E2E tests
        run: cd apps/web && bun run test:e2e

  test-mobile:
    runs-on: ericjohney-org-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run mobile unit tests
        run: cd apps/mobile && npx jest --forceExit

  eas-update:
    runs-on: ericjohney-org-runners
    needs: [test-web, test-mobile]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish to preview (push to main)
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://photobrain-api.ericj5.com
        run: cd apps/mobile && eas update --branch preview --message "main@${GITHUB_SHA::7}" --non-interactive

      - name: Publish to production (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://photobrain-api.ericj5.com
        run: cd apps/mobile && eas update --branch production --message "${{ github.ref_name }}" --non-interactive

  docker-api:
    runs-on: ericjohney-org-runners
    needs: [test-web, test-mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: |
            registry.ericj5.com/photobrain-api:latest
            registry.ericj5.com/photobrain-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Docker build summary
        run: |
          echo "API Docker image built and pushed successfully"
          echo "- registry.ericj5.com/photobrain-api:latest"
          echo "- registry.ericj5.com/photobrain-api:${{ github.sha }}"

  docker-web:
    runs-on: ericjohney-org-runners
    needs: [test-web, test-mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: |
            registry.ericj5.com/photobrain-web:latest
            registry.ericj5.com/photobrain-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Docker build summary
        run: |
          echo "Web Docker image built and pushed successfully"
          echo "- registry.ericj5.com/photobrain-web:latest"
          echo "- registry.ericj5.com/photobrain-web:${{ github.sha }}"

  docker-mobile:
    runs-on: ericjohney-org-runners
    needs: [test-web, test-mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push Mobile Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: mobile
          push: true
          tags: |
            registry.ericj5.com/photobrain-mobile:latest
            registry.ericj5.com/photobrain-mobile:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Docker build summary
        run: |
          echo "Mobile Docker image built and pushed successfully"
          echo "- registry.ericj5.com/photobrain-mobile:latest"
          echo "- registry.ericj5.com/photobrain-mobile:${{ github.sha }}"

  update-argocd:
    runs-on: ericjohney-org-runners
    needs: [docker-api, docker-web, docker-mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout ArgoCD repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argocd
          path: argocd
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}

      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags
        run: |
          cd argocd/apps/photobrain
          yq -i '.image.tag = "${{ github.sha }}"' values-api.yaml
          yq -i '.image.tag = "${{ github.sha }}"' values-web.yaml
          yq -i '.image.tag = "${{ github.sha }}"' values-mobile.yaml 2>/dev/null || true

      - name: Commit and push changes
        run: |
          cd argocd
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/photobrain/values-api.yaml apps/photobrain/values-web.yaml
          git add apps/photobrain/values-mobile.yaml 2>/dev/null || true
          git commit -m "Update photobrain image tags to ${{ github.sha }}" || exit 0
          git push
