name: EAS Preview iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-preview-ios
  cancel-in-progress: false

jobs:
  build-preview-ios:
    runs-on: ericjohney-org-runners
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Install EAS CLI
        run: npm install --global eas-cli@24.7.0

      - name: Build iOS preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: eas env:exec preview 'node scripts/ensure-preview-build.mjs --force' --non-interactive
        working-directory: apps/mobile
