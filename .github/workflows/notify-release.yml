name: Notify private publisher
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions: {}
jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Send the successful build run ID
        env:
          GH_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --method POST repos/ericjohney/argocd/dispatches \
            -f event_type=photobrain-release -f "client_payload[run_id]=$RUN_ID"
