# Camera profile: Sony A1 II (ILCE-1M2, 50 MP), Bayer RGGB, 14-bit ARW.
#
# Provenance
# - color_matrix_* / forward_matrix_* / calibration illuminants: Adobe DNG Converter 18.7
#   (Adobe Standard) output for 4309.ARW.
# - white_level: from RawCamera's deBayer_v8 `range` (4.12923 = 65535 / (white - 512)).
# - demosaic_exposure_factor: RawCamera's deBayer_v8 `exposureFactor` for this body
#   (constant across files and ISOs).
# - baseline_exposure, black_render, look_matrix_*: derived exactly from RawCamera's colour
#   and exposure color_matrix nodes (tools/calibrate/graph_color.py) of 12766, 4309 and 4309 with WB_RGGBLevels patched to tungsten.
# - Lens: distortion from the file's DistortionCorrParams when the camera flags it
#   (RawCamera ignores the CA and vignetting arrays); no profile data needed.
# - [[noise]]: RawCamera render graphs (macOS 26.5.1, decoder "8") of 4309.ARW with its
#   ISO/SOS/REI tags patched to each setting 50-102400 (docs/adding-a-camera.md, ISO-patch
#   method), transcribed with tools/calibrate/noise_table.py.

