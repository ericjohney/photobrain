# Camera profile: Fujifilm X-E5 (X-Trans 5 HR, 40 MP).
#
# Provenance
# - color_matrix_* / forward_matrix_* / calibration illuminants: Adobe DNG Converter
#   (Adobe Standard) output for DSCF0970.RAF, read with
#   `exiftool -n -ColorMatrix1 -ColorMatrix2 -ForwardMatrix1 -ForwardMatrix2 ...`.
# - white_level: the level Apple's RawCamera renders treat as clip for this camera, which
#   matches the observed highlight shoulder of the fixtures (sensor saturates at ~16200).
# - baseline_exposure, black_render, look_matrix_*, distortion_fill_scale: our own fits by
#   least squares against Apple CIRAWFilter renders of the 11 calibration fixtures
#   (`tools/calibrate/`).
# - [[noise]]: per-ISO parameters read from RawCamera 9.42.0 render graphs (CI_PRINT_TREE,
#   `tools/apple-reference` graph.txt) of X-E5 files shot at each 1/3-stop ISO, 64-12800,
#   transcribed into this schema (docs/camera-profiles.md, docs/noise-reduction.md).

make = "FUJIFILM"
model = "X-E5"

white_level = 16220.0

# Lowest native ISO (X-Trans 5 HR). The generic NR (Preview, or no noise table) scales
# with ISO / base_iso.
base_iso = 125.0

# Standard light A (2856 K) and D65 (6504 K).
calibration_illuminant_1 = 2856.0
calibration_illuminant_2 = 6504.0

color_matrix_1 = [1.324, -0.8203, 0.1401, -0.2281, 0.9572, 0.3184, 0.0329, 0.0141, 0.679]
color_matrix_2 = [1.1809, -0.5358, -0.1141, -0.4248, 1.2164, 0.2343, -0.0514, 0.1097, 0.5848]
forward_matrix_1 = [0.4116, 0.4388, 0.1138, 0.1488, 0.8203, 0.031, 0.0285, 0.0025, 0.7941]
forward_matrix_2 = [0.4016, 0.4015, 0.1612, 0.215, 0.7362, 0.0489, 0.0955, 0.0026, 0.727]

# Exposure applied before the look, in EV, in addition to -RawExposureBias. Fitted:
# Apple renders every fixture at (this - RawExposureBias).
#
# black_render: linear value subtracted before exposure (a small flare/black offset;
# renders lift shadows less than a pure gain would). Fitted.
black_render = 0.003
baseline_exposure = -0.4928

# White-preserving 3x3 (rows sum to 1) applied in linear Display P3 after the DNG
# forward-matrix transform, interpolated by 1/CCT like the DNG matrices. It carries the
# rendering's saturation and hue differences from Adobe Standard.
look_matrix_1 = [
  1.664918, -0.630939, -0.033979,
  -0.120286, 1.447166, -0.326880,
  -0.138203, -0.258971, 1.397174,
]
look_matrix_2 = [
  1.911015, -0.600960, -0.310055,
  -0.183062, 1.708983, -0.525921,
  -0.190129, -0.122339, 1.312468,
]

# Lens correction: Fuji GeometricDistortionParams are applied with this extra global
# scale (fitted: renders fill the frame ~1% tighter than the raw curve alone; equals the
# ratio in RawCamera's radial table, 1.01014).
distortion_fill_scale = 1.0101

# Per-ISO noise tuning, one entry per 1/3-stop ISO, read from RawCamera render graphs
# (CI_PRINT_TREE) for this camera; the nearest entry in log2(ISO) is used. See
# docs/noise-reduction.md.
# - demosaic_noise = rn: raw-value variance model rn[1] + v * rn[2] (rn[0] unused); sets how
#   much the demosaic smooths flat areas.
# - chroma_passes: chroma NR chain. threshold = [c0, c1, c2, moire]: a neighbour is averaged
#   when its weighted squared colour difference is below c0 + c1*Y + c2*Y^2.
# - luma: luminance pyramid recipe, full resolution first.

[[noise]]
iso = 64
demosaic_noise = [0.222567, 1.44514e-08, 3.29276e-05]
moire_detect = true
[[noise.chroma_passes]]
kind = "hf"
scale = 1
threshold = [8.50015e-09, 1.42612e-05, 3.51498e-05, 0.016]
[[noise.chroma_passes]]
kind = "hf"
scale = 3
threshold = [-1.49753e-09, 5.45724e-06, 1.28538e-05, 0.016]
[[noise.chroma_passes]]
kind = "hf_early_out"
scale = 7
threshold = [1.04428e-08, 7.33486e-07, 3.35748e-05, 0.016]
interpolant = 0.25
[[noise.luma]]
kind = "thru_g2"
parms = [1, 1, 0.00343426, 0.142857]
roparms = [0.0055635, 0.0166905, 0.011127, 0]
omparms = [0.499, 3.603]
anneal = [-2.44086e-09, 6.42783e-06, 1.73628e-05]
