[package]
name = "raw_develop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RAW development pipeline (Fujifilm X-Trans RAF to Display P3), modelled on Apple's RawCamera stage order"
publish = false

[lib]
name = "raw_develop"
path = "src/lib.rs"

[[bin]]
name = "raw-develop"
path = "src/bin/raw-develop.rs"

[[bin]]
name = "raw-compare"
path = "src/bin/raw-compare.rs"

[dependencies]
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff", "png"] }
# JPEG XL tiles in DNG 1.7 (iPhone 17 ProRAW). MIT OR Apache-2.0.
jxl-oxide = { version = "0.12", default-features = false, features = ["rayon"], optional = true }

[features]
default = ["jxl"]
jxl = ["dep:jxl-oxide"]

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
