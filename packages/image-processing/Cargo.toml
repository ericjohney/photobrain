
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2024"
name = "image_processing"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
image = { version = "0.25", features = ["webp"] }
webp = { version = "0.3.1", default-features = false }
image_hasher = "2.0"
fastembed = "4.4.0"
serde_json = "1.0"
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
walkdir = "2.5"
once_cell = "1.19"
libheif-rs = "1.0"
# Face models run on the ONNX Runtime binding fastembed already pins; never a second runtime.
ort = { version = "=2.0.0-rc.9", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
tempfile = "3.24.0"
matrixmultiply = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
